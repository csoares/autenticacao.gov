name: Build

on:
  push:
    branches: [qt6-macos-arm64, 'ci/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: '6.10.*'

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qt5compat
          cache: true

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build tools
        run: brew install autoconf automake libtool ninja swig gengetopt help2man

      - name: Restore third-party libraries
        id: deps-cache
        uses: actions/cache@v6
        with:
          path: ~/mw-thirdparty-libs
          key: macos-deps-${{ matrix.arch }}-${{ env.QT_VERSION }}-${{ hashFiles('.github/ci/macos/build-deps.sh') }}

      - name: Build third-party libraries
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: .github/ci/macos/build-deps.sh "$QT_ROOT_DIR"

      - name: Build the middleware
        run: .github/ci/macos/build-mw.sh

      # Archives keep the symlinks and permissions that upload-artifact drops
      - name: Archive the build
        run: |
          tar -czf mw-${{ matrix.arch }}.tar.gz -C pteid-mw-pt/_src/eidmw lib bin jar eidguiV2/eidguiV2.app
          tar -czf deps-${{ matrix.arch }}.tar.gz -C ~ mw-thirdparty-libs

      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: '*-${{ matrix.arch }}.tar.gz'
          retention-days: 7

  macos-package:
    name: macOS package
    needs: macos
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the package version uses the commit count

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qt5compat
          cache: true

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Install build tools
        run: brew install swig

      - uses: actions/download-artifact@v8
        with:
          pattern: macos-*
          merge-multiple: true

      - name: Merge arm64 and x86_64 into universal binaries
        run: |
          for arch in arm64 x86_64; do
            mkdir -p "build-$arch/mw" "build-$arch/deps"
            tar -xzf "mw-$arch.tar.gz" -C "build-$arch/mw"
            tar -xzf "deps-$arch.tar.gz" -C "build-$arch/deps"
          done
          .github/ci/macos/lipo-merge.sh build-arm64/deps/mw-thirdparty-libs build-x86_64/deps/mw-thirdparty-libs ~/mw-thirdparty-libs
          .github/ci/macos/lipo-merge.sh build-arm64/mw build-x86_64/mw universal
          cp -a universal/. pteid-mw-pt/_src/eidmw/

      - name: Build the CryptoTokenKit extension
        working-directory: pteid-mw-pt/_src/eidmw/pteid-ctk
        run: |
          xcodebuild -project pteid-ctk.xcodeproj -configuration Release \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO MACOSX_DEPLOYMENT_TARGET=13.0 CODE_SIGN_IDENTITY=-

      - name: Generate the package
        working-directory: pteid-mw-pt/_src/eidmw/misc/macos-pkg
        env:
          MW_SOURCE_DIR: ${{ github.workspace }}
          PTEID_PKG_ASSUME_YES: '1'
        # Without the AMA Developer ID certificate the package is signed ad-hoc
        run: ./generate_macos_pkg.sh -

      - name: Check the deployment target of the packaged binaries
        working-directory: pteid-mw-pt/_src/eidmw/misc/macos-pkg
        run: |
          status=0
          while IFS= read -r -d '' f; do
            file -b "$f" | grep -q Mach-O || continue
            for arch in arm64 x86_64; do
              minos=$(vtool -arch "$arch" -show-build "$f" 2>/dev/null | awk '/minos/ {print $2; exit}')
              if [ -z "$minos" ]; then
                echo "::error::$f has no $arch slice"; status=1
              elif [ "$(printf '%s\n13.0\n' "$minos" | sort -V | tail -1)" != 13.0 ]; then
                echo "::error::$f ($arch) targets macOS $minos"; status=1
              fi
            done
          done < <(find apps system-libs dialogs -type f -print0)
          exit $status

      - uses: actions/upload-artifact@v7
        with:
          name: macos-pkg
          path: pteid-mw-pt/_src/eidmw/misc/macos-pkg/pteid-mw-*.pkg

  flatpak:
    name: Linux Flatpak
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: pteid-mw-pt/_src/eidmw/pt.gov.autenticacao.yml
          bundle: pteid-mw.flatpak
          cache-key: flatpak-builder-${{ github.sha }}
